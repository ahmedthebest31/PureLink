name: Cross-Platform Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
            setup_cmd: go install github.com/tc-hib/go-winres@latest && go-winres make
            build_flags: -ldflags "-s -w -H=windowsgui"

          - os: ubuntu-20.04
            goos: linux
            goarch: amd64
            cgo: 1
            setup_cmd: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgtk-3-dev libappindicator3-dev
            build_flags: -ldflags "-s -w"

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
            setup_cmd: echo "No extra setup for macOS"
            build_flags: -ldflags "-s -w"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Dependencies
        run: go mod tidy

      - name: Setup OS Dependencies
        shell: bash
        run: ${{ matrix.setup_cmd }}

      - name: Build Binary and Generate Checksum
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          OUTPUT_FILE="PureLink-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" == "windows" ]; then
            OUTPUT_FILE="${OUTPUT_FILE}.exe"
          fi

          echo "Building ${OUTPUT_FILE}..."
          CGO_ENABLED=${{ matrix.cgo }} go build ${{ matrix.build_flags }} -o "${OUTPUT_FILE}"

          echo "Generating SHA256 checksum..."
          sha256sum "${OUTPUT_FILE}" > "${OUTPUT_FILE}.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            PureLink-*
          generate_release_notes: true
